name: Build IZIHIRWE APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
      - name: Backup our code
        run: |
          cp lib/main.dart /tmp/main.dart.bak
          cp -r lib/screens /tmp/screens.bak
          cp -r lib/models /tmp/models.bak
      - name: Create Android folder only
        run: flutter create . --platforms=android --project-name izihirwe_pro_v2
      - name: Restore our IZIHIRWE code
        run: |
          cp /tmp/main.dart.bak lib/main.dart
          rm -rf lib/screens lib/models
          cp -r /tmp/screens.bak lib/screens
          cp -r /tmp/models.bak lib/models
          ls -la lib/
      - name: Get dependencies
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: izihirwe-pro-v2-apk
          path: build/app/outputs/flutter-apk/app-release.apk
